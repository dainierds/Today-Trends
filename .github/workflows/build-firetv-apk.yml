name: Build Fire TV APK

on:
  workflow_dispatch:
    inputs:
      vercel_url:
        description: "Tu URL de Vercel (ej. https://today-trends.vercel.app)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor with Vercel URL
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.vercel_url }}
        run: npx cap sync android

      - name: Build Fire TV APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../today-trends-firetv.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-latest
          name: "Today Trends Fire TV APK"
          body: |
            APK listo para instalar en Fire TV / Android TV usando **Downloader**:
            URL directa: `https://github.com/${{ github.repository }}/releases/latest/download/today-trends-firetv.apk`
          files: today-trends-firetv.apk
          prerelease: false
          make_latest: true
